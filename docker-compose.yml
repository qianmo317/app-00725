version: "3.8"

services:
  # 数据应用门户前端
  frontend-portal:
    build:
      context: ./frontend-portal
      dockerfile: Dockerfile
    container_name: data-portal-frontend
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge
