<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据应用门户 - 应用广场</title>
    <link rel="stylesheet" href="../src/styles/main.scss" />
    <link rel="stylesheet" href="../src/styles/app-market.scss" />
  </head>
  <body class="portal-body">
    <!-- 顶部导航 -->
    <header class="portal-header">
      <div class="header-left">
        <div class="logo">
          <i class="layui-icon layui-icon-app"></i>
          <span>数据应用门户</span>
        </div>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <i class="layui-icon layui-icon-spread-left"></i>
      </button>
      <div class="header-center" id="headerNav">
        <ul class="nav-menu">
          <li class="nav-item" data-page="home">
            <i class="layui-icon layui-icon-home"></i>
            <span>首页工作台</span>
          </li>
          <li class="nav-item" data-page="card-factory">
            <i class="layui-icon layui-icon-chart"></i>
            <span>卡片工厂</span>
          </li>
          <li class="nav-item active" data-page="app-market">
            <i class="layui-icon layui-icon-template-1"></i>
            <span>应用广场</span>
          </li>
          <li class="nav-item" data-page="designer">
            <i class="layui-icon layui-icon-edit"></i>
            <span>低代码设计器</span>
          </li>
          <li class="nav-item" data-page="map">
            <i class="layui-icon layui-icon-location"></i>
            <span>地图服务</span>
          </li>
        </ul>
      </div>
      <div class="header-right">
        <div class="user-info">
          <img
            src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNiIgaGVpZ2h0PSIzNiIgdmlld0JveD0iMCAwIDM2IDM2Ij48cmVjdCBmaWxsPSIjMWU5ZmZmIiB3aWR0aD0iMzYiIGhlaWdodD0iMzYiIHJ4PSIxOCIvPjx0ZXh0IGZpbGw9IiNmZmYiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZm9udC13ZWlnaHQ9ImJvbGQiIHg9IjUwJSIgeT0iNTAlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjM1ZW0iPuW8oDwvdGV4dD48L3N2Zz4="
            alt="avatar"
            class="avatar"
          />
          <span class="username">张三</span>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="portal-main market-main">
      <!-- 顶部搜索和筛选 -->
      <section class="market-header">
        <div class="search-box">
          <i class="layui-icon layui-icon-search"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="搜索应用模板..."
            class="search-input"
          />
          <button class="search-btn" id="searchBtn">搜索</button>
        </div>
        <div class="filter-tabs">
          <div class="tab-item active" data-sort="hot">
            <i class="layui-icon layui-icon-fire"></i>
            热门推荐
          </div>
          <div class="tab-item" data-sort="new">
            <i class="layui-icon layui-icon-time"></i>
            最新发布
          </div>
          <div class="tab-item" data-sort="mine">
            <i class="layui-icon layui-icon-user"></i>
            我的应用
          </div>
        </div>
        <button class="layui-btn publish-btn" id="publishBtn">
          <i class="layui-icon layui-icon-upload"></i>
          发布应用
        </button>
      </section>

      <!-- 分类标签 -->
      <section class="category-section">
        <div class="category-tags" id="categoryTags">
          <span class="tag-item active" data-category="all">全部</span>
          <span class="tag-item" data-category="dashboard">数据看板</span>
          <span class="tag-item" data-category="report">报表分析</span>
          <span class="tag-item" data-category="monitor">监控告警</span>
          <span class="tag-item" data-category="hr">人力资源</span>
          <span class="tag-item" data-category="finance">财务管理</span>
          <span class="tag-item" data-category="sales">销售营销</span>
          <span class="tag-item" data-category="project">项目管理</span>
        </div>
      </section>

      <!-- 应用列表 -->
      <section class="app-list-section">
        <div class="app-grid" id="appGrid">
          <!-- 动态渲染 -->
        </div>
        <div class="empty-state" id="emptyState" style="display: none">
          <i class="layui-icon layui-icon-face-surprised"></i>
          <p>暂无相关应用</p>
        </div>
      </section>

      <!-- 分页 -->
      <section class="pagination-section">
        <div id="pagination"></div>
      </section>
    </main>

    <!-- 应用详情弹窗 -->
    <div id="appDetailModal" class="modal-overlay" style="display: none">
      <div class="modal-content app-detail-modal">
        <div class="modal-header">
          <h3 id="detailTitle">应用详情</h3>
          <i class="layui-icon layui-icon-close" id="closeDetailModal"></i>
        </div>
        <div class="modal-body">
          <div class="detail-preview">
            <img id="detailThumbnail" src="" alt="preview" />
          </div>
          <div class="detail-info">
            <p class="detail-desc" id="detailDesc"></p>
            <div class="detail-meta">
              <div class="meta-item">
                <i class="layui-icon layui-icon-user"></i>
                <span id="detailAuthor"></span>
              </div>
              <div class="meta-item">
                <i class="layui-icon layui-icon-group"></i>
                <span id="detailDept"></span>
              </div>
              <div class="meta-item">
                <i class="layui-icon layui-icon-time"></i>
                <span id="detailTime"></span>
              </div>
            </div>
            <div class="detail-tags" id="detailTags"></div>
            <div class="detail-stats">
              <div class="stat-item">
                <span class="stat-value" id="detailClones">0</span>
                <span class="stat-label">克隆次数</span>
              </div>
              <div class="stat-item">
                <span class="stat-value" id="detailLikes">0</span>
                <span class="stat-label">获赞数</span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="layui-btn layui-btn-lg" id="cloneAppBtn">
            <i class="layui-icon layui-icon-file"></i>
            克隆到我的工作台
          </button>
          <button
            class="layui-btn layui-btn-lg layui-btn-normal"
            id="likeAppBtn"
          >
            <i class="layui-icon layui-icon-praise"></i>
            点赞
          </button>
        </div>
      </div>
    </div>

    <!-- 发布应用弹窗 -->
    <div id="publishModal" class="modal-overlay" style="display: none">
      <div class="modal-content publish-modal">
        <div class="modal-header">
          <h3>发布应用到广场</h3>
          <i class="layui-icon layui-icon-close" id="closePublishModal"></i>
        </div>
        <div class="modal-body">
          <form class="layui-form publish-form" id="publishForm">
            <div class="layui-form-item">
              <label class="layui-form-label">应用名称</label>
              <div class="layui-input-block">
                <input
                  type="text"
                  name="name"
                  required
                  placeholder="请输入应用名称"
                  class="layui-input"
                />
              </div>
            </div>
            <div class="layui-form-item layui-form-text">
              <label class="layui-form-label">应用描述</label>
              <div class="layui-input-block">
                <textarea
                  name="description"
                  placeholder="请描述应用的功能和用途"
                  class="layui-textarea"
                ></textarea>
              </div>
            </div>
            <div class="layui-form-item">
              <label class="layui-form-label">应用分类</label>
              <div class="layui-input-block">
                <select name="category">
                  <option value="dashboard">数据看板</option>
                  <option value="report">报表分析</option>
                  <option value="monitor">监控告警</option>
                  <option value="hr">人力资源</option>
                  <option value="finance">财务管理</option>
                  <option value="sales">销售营销</option>
                  <option value="project">项目管理</option>
                </select>
              </div>
            </div>
            <div class="layui-form-item">
              <label class="layui-form-label">标签</label>
              <div class="layui-input-block">
                <input
                  type="text"
                  name="tags"
                  placeholder="多个标签用逗号分隔"
                  class="layui-input"
                />
              </div>
            </div>
            <div class="layui-form-item">
              <label class="layui-form-label">选择工作台</label>
              <div class="layui-input-block">
                <select name="workspace">
                  <option value="default">默认工作台</option>
                  <option value="custom1">自定义工作台1</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="layui-btn" id="submitPublish">发布</button>
          <button class="layui-btn layui-btn-primary" id="cancelPublish">
            取消
          </button>
        </div>
      </div>
    </div>

    <!-- 脚本引入 -->
    <script type="module" src="../src/js/vendor.js"></script>
    <script type="module" src="../src/js/pages/app-market.js"></script>
  </body>
</html>
